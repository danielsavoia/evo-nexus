<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" role="img" aria-label="Clever Agent icon">
  <title>Clever Agent</title>
  <defs>
    <linearGradient id="hexGrad" x1="50" y1="0" x2="50" y2="100" gradientUnits="userSpaceOnUse">
      <stop offset="0%"   stop-color="#85F2A0"/>
      <stop offset="55%"  stop-color="#41A650"/>
      <stop offset="100%" stop-color="#255938"/>
    </linearGradient>
  </defs>

  <!-- Hexagonal connecting lines -->
  <g stroke="url(#hexGrad)" stroke-width="3" stroke-linecap="round" fill="none" id="hex-lines">
    <line x1="50" y1="12" x2="82" y2="31"/>
    <line x1="82" y1="31" x2="82" y2="69"/>
    <line x1="82" y1="69" x2="50" y2="88"/>
    <line x1="50" y1="88" x2="18" y2="69"/>
    <line x1="18" y1="69" x2="18" y2="31"/>
    <line x1="18" y1="31" x2="50" y2="12"/>
  </g>

  <!-- Vertex nodes — top: mint, lower-left: dark, lower-right: yellow -->
  <circle id="node-top"         cx="50" cy="12" r="5.5" fill="#85F2A0"/>
  <circle id="node-lower-left"  cx="18" cy="69" r="5.5" fill="#255938"/>
  <circle id="node-lower-right" cx="82" cy="69" r="5.5" fill="#F2CB05"/>

  <!-- Agent / chat bubble -->
  <path id="bubble"
    d="M38,35 H62 Q68,35 68,41 V55 Q68,61 62,61 H52 L47,68 L44,61 H38 Q32,61 32,55 V41 Q32,35 38,35 Z"
    fill="#255938"/>

  <!-- Agent eyes -->
  <circle id="eye-left"  cx="43" cy="48" r="3.5" fill="#85F2A0"/>
  <circle id="eye-right" cx="57" cy="48" r="3.5" fill="#85F2A0"/>
</svg>
