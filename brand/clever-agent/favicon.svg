<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" fill="none" role="img" aria-label="Clever Agent">
  <title>Clever Agent Favicon</title>

  <!-- Circular dark background -->
  <circle cx="50" cy="50" r="50" fill="#19402A"/>

  <!-- Chat bubble (mint, fills most of the circle) -->
  <rect x="14" y="24" width="72" height="44" rx="11" fill="#85F2A0"/>
  <!-- Bubble tail -->
  <path d="M 26,68 L 16,82 L 40,68 Z" fill="#85F2A0"/>

  <!-- Robot eyes (dark on mint bubble) -->
  <rect x="24" y="37" width="17" height="19" rx="5" fill="#19402A"/>
  <rect x="59" y="37" width="17" height="19" rx="5" fill="#19402A"/>

  <!-- Yellow accent node -->
  <circle cx="80" cy="78" r="9" fill="#F2CB05"/>
</svg>
