<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 220" role="img" aria-label="Clever Agent logo">
  <title>Clever Agent</title>
  <defs>
    <linearGradient id="ca-frame-grad-light" x1="40" y1="18" x2="180" y2="180" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#85F2A0"/>
      <stop offset="0.48" stop-color="#41A650"/>
      <stop offset="1" stop-color="#255938"/>
    </linearGradient>
    <linearGradient id="ca-clever-grad-light" x1="270" y1="76" x2="520" y2="150" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#19402A"/>
      <stop offset="1" stop-color="#255938"/>
    </linearGradient>
    <linearGradient id="ca-agent-grad-light" x1="560" y1="76" x2="860" y2="150" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#41A650"/>
      <stop offset="1" stop-color="#41A650"/>
    </linearGradient>
    <style>.wm { font-family: "Poppins", "Montserrat", "Segoe UI", Arial, sans-serif; font-size: 108px; font-weight: 700; letter-spacing: -2px; }</style>
  </defs>
  <g id="icon">
    <g id="frame" fill="none" stroke="url(#ca-frame-grad-light)" stroke-width="14" stroke-linecap="round" stroke-linejoin="round">
      <path d="M103 38 L56 65"/>
      <path d="M121 38 L168 65"/>
      <path d="M42 74 L42 128"/>
      <path d="M182 74 L182 128"/>
      <path d="M58 150 L112 180 L166 150"/>
    </g>
    <g id="nodes">
      <circle cx="112" cy="26" r="14" fill="#85F2A0"/>
      <circle cx="42" cy="138" r="14" fill="#19402A"/>
      <circle cx="182" cy="138" r="14" fill="#F2CB05"/>
    </g>
    <g id="bubble">
      <rect x="64" y="72" width="96" height="62" rx="28" fill="#19402A"/>
      <path d="M106 132 L124 132 L112 151 Z" fill="#19402A"/>
    </g>
    <g id="eyes">
      <rect x="90" y="95" width="16" height="20" rx="8" fill="#85F2A0"/>
      <rect x="118" y="95" width="16" height="20" rx="8" fill="#85F2A0"/>
    </g>
  </g>
  <g id="wordmark" transform="translate(248,0)">
    <text id="text-clever" class="wm" x="0" y="140" fill="url(#ca-clever-grad-light)">Clever</text>
    <text id="text-agent" class="wm" x="353" y="140" fill="url(#ca-agent-grad-light)">Agent</text>
  </g>
</svg>
