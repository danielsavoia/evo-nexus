<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 450 90" fill="none" role="img" aria-label="Clever Agent">
  <title>Clever Agent (Dark Background)</title>
  <defs>
    <linearGradient id="ca-lhd-bg" x1="0" y1="0" x2="1" y2="0" gradientUnits="objectBoundingBox">
      <stop offset="0%" stop-color="#255938"/>
      <stop offset="100%" stop-color="#19402A"/>
    </linearGradient>
    <linearGradient id="ca-lhd-hex" x1="0" y1="0" x2="0" y2="1" gradientUnits="objectBoundingBox">
      <stop offset="0%" stop-color="#85F2A0"/>
      <stop offset="100%" stop-color="#41A650"/>
    </linearGradient>
  </defs>

  <!-- Dark background -->
  <rect width="450" height="90" rx="12" fill="url(#ca-lhd-bg)"/>

  <!-- Icon (scaled 100×100 → 90×90) -->
  <g transform="scale(0.9)">
    <line x1="50" y1="12" x2="17.1" y2="69" stroke="#85F2A0" stroke-width="2" stroke-linecap="round" opacity="0.25"/>
    <line x1="50" y1="12" x2="82.9" y2="69" stroke="#85F2A0" stroke-width="2" stroke-linecap="round" opacity="0.25"/>
    <polygon points="50,12 82.9,31 82.9,69 50,88 17.1,69 17.1,31" stroke="url(#ca-lhd-hex)" stroke-width="3.5" stroke-linejoin="round" fill="none"/>
    <rect x="28" y="34" width="44" height="28" rx="8" fill="#255938"/>
    <path d="M 38,62 L 31,72 L 49,62 Z" fill="#255938"/>
    <rect x="36" y="41.5" width="10" height="11" rx="3.5" fill="#85F2A0"/>
    <rect x="54" y="41.5" width="10" height="11" rx="3.5" fill="#85F2A0"/>
    <circle cx="50"   cy="12" r="5.5" fill="#85F2A0"/>
    <circle cx="17.1" cy="69" r="5"   fill="#41A650"/>
    <circle cx="82.9" cy="69" r="6.5" fill="#F2CB05"/>
  </g>

  <!-- Wordmark (light on dark) -->
  <text
    font-family="'Inter', 'Helvetica Neue', system-ui, -apple-system, sans-serif"
    font-size="50"
    font-weight="700"
    letter-spacing="-0.5"
  >
    <tspan x="100" y="63" fill="#F7F9F8">Clever</tspan>
    <tspan fill="#85F2A0"> Agent</tspan>
  </text>
</svg>
