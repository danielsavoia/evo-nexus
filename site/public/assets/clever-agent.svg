<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 270 70" role="img" aria-label="Clever Agent logo">
  <title>Clever Agent</title>
  <!--
    Wordmark font: DM Sans 600 or Inter 600
    Fallback chain: 'DM Sans', 'Inter', 'Nunito', system-ui, sans-serif
    For production: convert text to paths using the exact font at weight 600.
  -->
  <defs>
    <linearGradient id="hg" x1="8" y1="8" x2="8" y2="62" gradientUnits="userSpaceOnUse">
      <stop offset="0%"   stop-color="#85F2A0"/>
      <stop offset="55%"  stop-color="#41A650"/>
      <stop offset="100%" stop-color="#255938"/>
    </linearGradient>
  </defs>

  <!-- Icon — 100×100 source scaled to 54×54, positioned at (8,8) -->
  <g id="icon" transform="translate(8,8) scale(0.54)">
    <g stroke="url(#hg)" stroke-width="3" stroke-linecap="round" fill="none">
      <line x1="50" y1="12" x2="82" y2="31"/>
      <line x1="82" y1="31" x2="82" y2="69"/>
      <line x1="82" y1="69" x2="50" y2="88"/>
      <line x1="50" y1="88" x2="18" y2="69"/>
      <line x1="18" y1="69" x2="18" y2="31"/>
      <line x1="18" y1="31" x2="50" y2="12"/>
    </g>
    <circle cx="50" cy="12" r="5.5" fill="#85F2A0"/>
    <circle cx="18" cy="69" r="5.5" fill="#255938"/>
    <circle cx="82" cy="69" r="5.5" fill="#F2CB05"/>
    <path d="M38,35 H62 Q68,35 68,41 V55 Q68,61 62,61 H52 L47,68 L44,61 H38 Q32,61 32,55 V41 Q32,35 38,35 Z" fill="#255938"/>
    <circle cx="43" cy="48" r="3.5" fill="#85F2A0"/>
    <circle cx="57" cy="48" r="3.5" fill="#85F2A0"/>
  </g>

  <!-- Wordmark -->
  <text id="wordmark"
    x="72" y="44"
    font-family="'DM Sans','Inter','Nunito',system-ui,-apple-system,sans-serif"
    font-size="32"
    font-weight="600"
    letter-spacing="-0.4">
    <tspan fill="#19402A">Clever </tspan><tspan fill="#41A650">Agent</tspan>
  </text>
</svg>
