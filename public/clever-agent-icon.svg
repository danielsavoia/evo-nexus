<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" fill="none" role="img" aria-label="Clever Agent">
  <title>Clever Agent</title>
  <defs>
    <linearGradient id="ca-hex-g" x1="0" y1="0" x2="0" y2="1" gradientUnits="objectBoundingBox">
      <stop offset="0%" stop-color="#85F2A0"/>
      <stop offset="100%" stop-color="#255938"/>
    </linearGradient>
  </defs>

  <!-- Network connection lines -->
  <line x1="50" y1="12" x2="17.1" y2="69" stroke="#41A650" stroke-width="2" stroke-linecap="round" opacity="0.35"/>
  <line x1="50" y1="12" x2="82.9" y2="69" stroke="#41A650" stroke-width="2" stroke-linecap="round" opacity="0.35"/>

  <!-- Hexagonal frame -->
  <polygon
    points="50,12 82.9,31 82.9,69 50,88 17.1,69 17.1,31"
    stroke="url(#ca-hex-g)"
    stroke-width="3.5"
    stroke-linejoin="round"
    fill="none"
  />

  <!-- Chat bubble body -->
  <rect x="28" y="34" width="44" height="28" rx="8" fill="#19402A"/>
  <!-- Bubble tail -->
  <path d="M 38,62 L 31,72 L 49,62 Z" fill="#19402A"/>

  <!-- Robot eyes -->
  <rect x="36" y="41.5" width="10" height="11" rx="3.5" fill="#85F2A0"/>
  <rect x="54" y="41.5" width="10" height="11" rx="3.5" fill="#85F2A0"/>

  <!-- Network nodes -->
  <circle cx="50"  cy="12"   r="5.5" fill="#85F2A0"/>
  <circle cx="17.1" cy="69"  r="5"   fill="#255938" stroke="#85F2A0" stroke-width="1.5"/>
  <circle cx="82.9" cy="69"  r="6.5" fill="#F2CB05"/>
</svg>

