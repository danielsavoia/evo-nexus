<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" role="img" aria-label="Clever Agent favicon">
  <title>Clever Agent</title>
  <!--
    Favicon optimized for 16×16 and 32×32 display.
    Simplified: dark background + bold chat bubble with eyes.
    Hex lines omitted at this scale — recognized by bubble shape alone.
  -->

  <!-- Background -->
  <rect width="32" height="32" rx="7" fill="#255938"/>

  <!-- Simplified hex nodes — visible as accent dots at small size -->
  <circle cx="16" cy="3"  r="2"   fill="#85F2A0"/>
  <circle cx="5"  cy="24" r="2"   fill="#85F2A0"/>
  <circle cx="27" cy="24" r="2"   fill="#F2CB05"/>

  <!-- Bold chat bubble -->
  <path d="M8,11 H24 Q27,11 27,14 V21 Q27,24 24,24 H18 L15,27 L14,24 H8 Q5,24 5,21 V14 Q5,11 8,11 Z"
        fill="#85F2A0"/>

  <!-- Eyes -->
  <circle cx="12" cy="17.5" r="2.2" fill="#255938"/>
  <circle cx="20" cy="17.5" r="2.2" fill="#255938"/>
</svg>
